name: Scheduled Traffic Update & Pages Deploy

# Action majors are pinned to the current node24 releases (2026-10-17):
#   checkout v7, setup-python v7, setup-node v7,
#   configure-pages v6, upload-pages-artifact v5, deploy-pages v5.
# Node 20 was removed from GitHub Actions runners on 2026-09-23, so the
# node20-based majors (checkout v4, setup-python v5, setup-node v4,
# configure-pages v5, upload-pages-artifact v3, deploy-pages v4) no longer run.

on:
  schedule:
    # 5 runs daily (UTC cron times corresponding to CET/CEST dispatch windows):
    # NOTE: crons are fixed UTC while Italy switches between CET (UTC+1) and
    # CEST (UTC+2), so during CEST every run fires one hour later locally.
    # 05:30 UTC -> 06:30 IT in winter, 07:30 IT in summer
    - cron: '30 5 * * *'
    # 10:00 UTC -> 11:00 IT in winter, 12:00 IT in summer
    - cron: '0 10 * * *'
    # 13:30 UTC -> 14:30 IT in winter, 15:30 IT in summer
    - cron: '30 13 * * *'
    # 16:30 UTC -> 17:30 IT in winter, 18:30 IT in summer
    - cron: '30 16 * * *'
    # 20:00 UTC -> 21:00 IT in winter, 22:00 IT in summer
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger button in GitHub Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and git commit push
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Traffic Ingestion Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # fetch_traffic.py derives today's date and "last_updated" from
          # datetime.now(); without TZ the runner would record UTC and the UI
          # (which renders last_updated as-is) would show the wrong local time.
          TZ: Europe/Rome
        run: |
          python fetch_traffic.py

      - name: Commit Fresh Traffic Data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/traffic_data.json
          git diff --staged --quiet || git commit -m "Auto-update traffic data [skip ci]"
          git push || echo "No changes to commit or push"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint and Build Production SPA
        run: |
          npm run lint
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
