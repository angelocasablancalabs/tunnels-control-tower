name: Scheduled Traffic Update & Pages Deploy

# Action majors are pinned to the current node24 releases (2026-10-17):
#   checkout v7, setup-python v7, setup-node v7,
#   configure-pages v6, upload-pages-artifact v5, deploy-pages v5.
# Node 20 was removed from GitHub Actions runners on 2026-09-23, so the
# node20-based majors (checkout v4, setup-python v5, setup-node v4,
# configure-pages v5, upload-pages-artifact v3, deploy-pages v4) no longer run.

on:
  schedule:
    # 5 daily dispatch slots with automatic recovery tick (+35 min) to eliminate dropped runs:
    # Slot 1: ~06:15 CEST / 05:15 CET (recovery ~06:50 CEST / 05:50 CET)
    - cron: '15 4 * * *'
    - cron: '50 4 * * *'
    # Slot 2: ~10:45 CEST / 09:45 CET (recovery ~11:20 CEST / 10:20 CET)
    - cron: '45 8 * * *'
    - cron: '20 9 * * *'
    # Slot 3: ~14:15 CEST / 13:15 CET (recovery ~14:50 CEST / 13:50 CET)
    - cron: '15 12 * * *'
    - cron: '50 12 * * *'
    # Slot 4: ~17:45 CEST / 16:45 CET (recovery ~18:20 CEST / 17:20 CET)
    - cron: '45 15 * * *'
    - cron: '20 16 * * *'
    # Slot 5: ~21:15 CEST / 20:15 CET (recovery ~21:50 CEST / 20:50 CET)
    - cron: '15 19 * * *'
    - cron: '50 19 * * *'
  push:
    branches: [ main ]
    # A frontend push must rebuild Pages immediately without spending Gemini
    # quota; only data/doc side-effects of the pipeline are ignored here so the
    # bot's own "Auto-update traffic data" commit cannot retrigger a deploy.
    paths-ignore:
      - 'public/traffic_data.json'
      - 'README.md'
      - 'PROGRESS.md'
      - '.gitignore'
  workflow_dispatch: # Allows manual trigger button in GitHub Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and git commit push
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 1. Freshness & Idempotency Gate (for scheduled runs)
      #    Skips redundant recovery ticks if public/traffic_data.json was already
      #    updated within the last 100 minutes. Push and workflow_dispatch always proceed.
      - name: Check Update Freshness
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PROCEED=$(python3 -c "
import json, sys
from datetime import datetime
from zoneinfo import ZoneInfo

try:
    with open('public/traffic_data.json', 'r', encoding='utf-8') as f:
        data = json.load(f)
    last_str = data.get('last_updated', '')
    last_dt = datetime.strptime(last_str, '%Y-%m-%d %H:%M').replace(tzinfo=ZoneInfo('Europe/Rome'))
    now_dt = datetime.now(ZoneInfo('Europe/Rome'))
    diff_min = (now_dt - last_dt).total_seconds() / 60
    print(f'Last update: {last_str} Rome time ({diff_min:.1f} min ago)', file=sys.stderr)
    if diff_min < 100:
        print('false')
    else:
        print('true')
except Exception as e:
    print(f'Warning parsing last_updated: {e}', file=sys.stderr)
    print('true')
")
            echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
            echo "Gate decision: proceed=$PROCEED"
          else
            echo "Triggered via ${{ github.event_name }}. Proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      # 2. Python environment & Gemini data ingestion (SKIPPED on git push to save API calls)
      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true' && github.event_name != 'push'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        if: steps.gate.outputs.proceed == 'true' && github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Traffic Ingestion Script
        if: steps.gate.outputs.proceed == 'true' && github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # fetch_traffic.py derives today's date and "last_updated" from
          # datetime.now(); without TZ the runner would record UTC and the UI
          # (which renders last_updated as-is) would show the wrong local time.
          TZ: Europe/Rome
        run: |
          python fetch_traffic.py

      - name: Commit Fresh Traffic Data (if changed)
        if: steps.gate.outputs.proceed == 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/traffic_data.json
          git diff --staged --quiet || git commit -m "Auto-update traffic data [skip ci]"
          git push || echo "No changes to commit or push"

      # 3. Node.js Frontend Build & GitHub Pages Deploy (runs on push, manual dispatch,
      #    and scheduled runs when gate proceeds)
      - name: Set up Node.js
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Frontend Dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: npm ci

      - name: Lint and Build Production SPA
        if: steps.gate.outputs.proceed == 'true'
        run: |
          npm run lint
          npm run build

      - name: Setup Pages
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/deploy-pages@v5
